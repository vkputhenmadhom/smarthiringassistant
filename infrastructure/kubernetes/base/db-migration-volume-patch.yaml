apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
      volumes:
        - name: migration-script
          configMap:
            name: db-migration-script
            defaultMode: 0755
            items:
              - key: migrate-all-to-hiring.sql
                path: migrate-all-to-hiring.sql
