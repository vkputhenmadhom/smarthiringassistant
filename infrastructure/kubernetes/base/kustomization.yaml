apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-hiring
resources:
  - namespace.yaml
  - db-migration-configmap.yaml
  - api-gateway.yaml
  - auth-service.yaml
  - resume-parser-service.yaml
  - screening-bot-service.yaml
  - candidate-matcher-service.yaml
  - interview-prep-service.yaml
  - notification-service.yaml
  - servicemonitors.yaml

patches:
  - path: db-migration-auth-service-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: auth-service
  - path: db-migration-resume-parser-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: resume-parser-service
  - path: db-migration-candidate-matcher-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: candidate-matcher-service
