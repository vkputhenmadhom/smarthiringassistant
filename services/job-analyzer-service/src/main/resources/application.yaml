spring:
  application:
    name: job-analyzer-service
  # Job feeds: the packaged job-feeds.yml, replaced by /config/job-feeds.yml when mounted (docker-compose does).
  config:
    import:
      - "classpath:job-feeds.yml"
      - "optional:file:${JOB_FEEDS_FILE:/config/job-feeds.yml}"
      # Skills looked for in job titles and descriptions, the same way
      - "classpath:job-skills.yml"
      - "optional:file:${JOB_SKILLS_FILE:/config/job-skills.yml}"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hiring_user}
    password: ${RABBITMQ_PASSWORD:hiring_password}
    virtual-host: ${RABBITMQ_VHOST:/}
  mongodb:
    uri: ${MONGODB_URI:mongodb://${MONGODB_USER:hiring_user}:${MONGODB_PASSWORD:hiring_password}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:smart_hiring_db}?authSource=${MONGODB_AUTH_SOURCE:admin}}

server:
  port: 8005
  servlet:
    context-path: /api/jobs

openai:
  api:
    key: ${OPENAI_API_KEY:sk-your-key-here}
  model: gpt-4-turbo-preview

job:
  analyzer:
    extract-salary: true
    extract-skills: true
    predict-market-salary: true

# ── External job-board sync ───────────────────────────────────────────────────
# Set job-sync.enabled=true (or env JOB_SYNC_ENABLED=true) to activate.
# Provide at least one source API key to start pulling real jobs.
#
# Sources
#   JSearch  (RapidAPI) – aggregates LinkedIn, Indeed, Glassdoor, ZipRecruiter
#     → https://rapidapi.com/letscrape-6bRBa3QguO5/api/jsearch  (free: 200 req/month)
#   Adzuna               – broad job board aggregator
#     → https://developer.adzuna.com  (free: 250 req/day)
# ─────────────────────────────────────────────────────────────────────────────
# Which jobs candidates see and are matched against: blank = every job, IN = India (India imports plus
# jobs posted in the app). Jobs outside the market are kept and stay visible to HR.
job-market:
  region: ${JOB_MARKET:}

job-sync:
  enabled: ${JOB_SYNC_ENABLED:false}
  # The primary import below is the US/global one; the India and remote feeds are in job-feeds.yml.
  global-enabled: ${JOB_SYNC_GLOBAL_ENABLED:true}
  # Once a day at 06:00 IST (00:30 UTC), which keeps JSearch within its 200-a-month free plan.
  cron: "${JOB_SYNC_CRON:0 30 0 * * *}"
  max-per-sync: 50
  # Two-letter ISO code for the primary import. It used to say "india", which JSearch ignores (it returned
  # US jobs) and which is not a valid Adzuna country; India is imported by the feeds in job-feeds.yml.
  country: us
  keywords:
    - "technical lead"
    - "staff software engineer"
    - "senior backend engineer"
    - "full-stack developer"
    - "principal software engineer"
  jsearch:
    api-key:    ${JSEARCH_API_KEY:}
    base-url:   https://jsearch.p.rapidapi.com
    date-posted: week
    num-pages:  1
  adzuna:
    app-id:            ${ADZUNA_APP_ID:}
    app-key:           ${ADZUNA_APP_KEY:}
    base-url:          https://api.adzuna.com/v1/api
    results-per-page:  20
  # The feeds themselves (keywords, tabs, filters) are in job-feeds.yml.
  feeds-enabled: ${JOB_SYNC_INDIA_ENABLED:false}

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      service: job-analyzer-service
