# ─────────────────────────────────────────────────────────────────────────────
# Skills looked for in job titles and descriptions (whole words, case-insensitive; Go only as "Go").
# Leave out names that are everyday words (C, R, Express): they would be found in ordinary text.
# Each entry is written the way it is shown and matched. Jobs keep skills their source lists too
# (JSearch sends some).
#
# docker-compose mounts this file into job-analyzer-service (/config/job-skills.yml): edit it and restart
# the service. At startup, imported jobs' skills are re-read with this list, and the matcher is told.
# Candidate-side spellings ("ReactJS", "Golang") are mapped in candidate-matcher's matching.skill-aliases.
# ─────────────────────────────────────────────────────────────────────────────
job-skills:
  dictionary:
    # Languages
    - Java
    - Kotlin
    - Scala
    - Groovy
    - Python
    - Go
    - Golang
    - Rust
    - C++
    - C#
