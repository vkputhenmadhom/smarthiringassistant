spring:
  application:
    name: ai-integration-service
  # Instructions for the AI endpoints: the packaged ai-prompts.yml, replaced by /config/ai-prompts.yml when mounted.
  config:
    import:
      - "classpath:ai-prompts.yml"
      - "optional:file:${AI_PROMPTS_FILE:/config/ai-prompts.yml}"
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/smart_hiring_db}
  ai:
    model:
      # Which provider serves chat: openai | anthropic
      chat: ${AI_PROVIDER:openai}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5.4-mini}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-opus-5-5}

server:
  port: 8008
  servlet:
    context-path: /api/ai

ai:
  max-prompt-chars: ${AI_MAX_PROMPT_CHARS:12000}
  # Output budget per request, including the model's reasoning tokens
  min-output-tokens: ${AI_MIN_OUTPUT_TOKENS:1024}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4096}
  max-batch-size: ${AI_MAX_BATCH_SIZE:5}
  cache-ttl-minutes: ${AI_CACHE_TTL_MINUTES:60}
  rate-limit:
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
