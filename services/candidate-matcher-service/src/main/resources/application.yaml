spring:
  application:
    name: candidate-matcher-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_hiring_db}
    username: ${POSTGRES_USER:hiring_user}
    password: ${POSTGRES_PASSWORD:hiring_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: hiring
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-candidate-matcher.sql
  cache:
    type: redis
    redis:
      time-to-live: 3600000 # 1 hour
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hiring_user}
    password: ${RABBITMQ_PASSWORD:hiring_password}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:hiring_password}
      timeout: 2000ms

server:
  port: 8003
  servlet:
    context-path: /api/matches

grpc:
  server:
    port: 9003

matching:
  # A match needs a relevant skill and at least this score (0-100) over the parts the job states.
  min-score: ${MATCHING_MIN_SCORE:50}
  # Only the best matches are kept for each parsed resume.
  max-matches-per-resume: ${MATCHING_MAX_MATCHES_PER_RESUME:20}
  # A job's skill share is divided by at least this many skills: one listed skill alone cannot give 100%.
  min-required-skills: 3
  # The most the skill part scores when the job title names a skill the candidate lacks (".NET" in
  # "Senior Software Engineer - .NET"): such a skill is the job's core.
  missing-title-skill-cap: 40
  # Points off the experience part per year above a job's range (stated years, or its title's level from
  # job-analyzer's job-skills.yml), down to 20: an 18-year engineer for a new-grad job.
  over-qualified-penalty-per-year: 8
  # Other spellings of a skill (lower case) and the name to compare them as.
  skill-aliases:
    reactjs: react
    react.js: react
    nodejs: node.js
    node: node.js
    golang: go
    postgres: postgresql
    k8s: kubernetes
    js: javascript
    ts: typescript
    springboot: spring boot
    spring-boot: spring boot
    amazon web services: aws
    google cloud: gcp
    google cloud platform: gcp
    microsoft azure: azure
    ci-cd: ci/cd
    "ci / cd": ci/cd
    rest: rest api
    rest apis: rest api
    restful apis: rest api
  # Other names of a place (lower case) and the name to compare them as.
  location-aliases:
    bangalore: bengaluru
    trivandrum: thiruvananthapuram
    cochin: kochi
    ernakulam: kochi
    bombay: mumbai
    madras: chennai
    calcutta: kolkata
    gurgaon: gurugram
    new delhi: delhi
  algorithm:
    skill-weight: 0.5
    experience-weight: 0.3
    education-weight: 0.2

events:
  outbox:
    enabled: true
    relay-interval-ms: 3000
  inbox:
    enabled: true
  replay:
    enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  main:
    allow-circular-references: true
