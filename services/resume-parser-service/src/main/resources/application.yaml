spring:
  application:
    name: resume-parser-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_hiring_db}
    username: ${POSTGRES_USER:hiring_user}
    password: ${POSTGRES_PASSWORD:hiring_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: hiring
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-resume-parser.sql
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:hiring_user}
    password: ${RABBITMQ_PASSWORD:hiring_password}
    virtual-host: ${RABBITMQ_VHOST:/}

# AI resume parsing (ai-integration-service /analyze-resume; instructions in its ai-prompts.yml).
# Off, or on any failure, the rule-based parser alone reads the resume.
resume-parser:
  ai:
    enabled: ${RESUME_AI_ENABLED:true}
    base-url: ${AI_SERVICE_URL:http://ai-integration-service:8008/api/ai}
    # Resume text sent to the AI; below ai-integration's ai.max-prompt-chars (24000), which also counts the tags
    max-chars: 20000
    # Below the portal's upload timeout, so a slow answer falls back instead of failing the upload
    timeout-seconds: 45

server:
  port: 8002
  servlet:
    context-path: /api/resumes

grpc:
  server:
    port: 9091

file:
  upload:
    path: /tmp/resumes
    max-size: 10485760 # 10MB

openai:
  api:
    key: ${OPENAI_API_KEY:sk-your-key-here}

events:
  outbox:
    enabled: true
    relay-interval-ms: 3000
  replay:
    enabled: true

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

security:
  encryption:
    # Required, at least 32 characters: `openssl rand -base64 48`. No default: a default would be public.
    key: ${RESUME_ENCRYPTION_KEY}
    # Comma-separated older keys, used only to decrypt and to re-encrypt existing data at startup.
    previous-keys: ${RESUME_ENCRYPTION_PREVIOUS_KEYS:}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

