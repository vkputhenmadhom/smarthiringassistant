# App-layer compose file with health checks and baseline scaling hints.
# Use together with docker-compose.yml (infra):
# docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d --build
#
# Only the API gateway (8000), the frontends and auth-service (8001, for the Google
# OAuth2 redirect URI) are published to the host. Every other service is reachable
# only through the gateway. To publish them for debugging or the scripts/ smoke tests,
# add: -f docker-compose.debug-ports.yml
# Applied to every backend service: no privilege escalation and no Linux capabilities. The JVM
# services run as a non-root user (see their Dockerfiles) and listen on ports above 1024.
x-app-hardening: &app-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # Applies the idempotent schema script before the JPA services start (ddl-auto: validate),
  # mirroring the Kubernetes init containers. Runs once per `up` and exits.
  db-migrate:
    <<: *app-hardening
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    volumes:
      - ./infrastructure/db/migrate-all-to-hiring.sql:/migrations/migrate-all-to-hiring.sql:ro
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}", "-d", "smart_hiring_db",
              "-v", "ON_ERROR_STOP=1", "-q", "-f", "/migrations/migrate-all-to-hiring.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - smart-hiring-network

  auth-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "8001:8001"   # published for the Google OAuth2 redirect URI
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_hiring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      # Signs tokens the gateway verifies, so both must get the same value
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (set it in .env)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required (set it in .env)}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required (set it in .env)}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/auth/login/oauth2/code/google}
      OAUTH2_SUCCESS_REDIRECT_URI_CANDIDATE: ${OAUTH2_SUCCESS_REDIRECT_URI_CANDIDATE:-http://localhost:5173/auth/callback}
      OAUTH2_SUCCESS_REDIRECT_URI_HR_ADMIN: ${OAUTH2_SUCCESS_REDIRECT_URI_HR_ADMIN:-http://localhost:4200/auth/callback}
      OAUTH2_FAILURE_REDIRECT_URI: ${OAUTH2_FAILURE_REDIRECT_URI:-http://localhost:5173/login}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9001/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  api-gateway:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_hiring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (set it in .env)}
    depends_on:
      auth-service:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/actuator/health || wget -q -O /dev/null http://localhost:8000/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  resume-parser-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/resume-parser-service/Dockerfile
    expose:
      - "8002"
    environment:
      # Encrypts sensitive resume data; previous keys are only for reading/re-encrypting older data
      RESUME_ENCRYPTION_KEY: ${RESUME_ENCRYPTION_KEY:?RESUME_ENCRYPTION_KEY is required (see .env.example)}
      RESUME_ENCRYPTION_PREVIOUS_KEYS: ${RESUME_ENCRYPTION_PREVIOUS_KEYS:-}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_hiring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8002/api/resumes/actuator/health || wget -q -O /dev/null http://localhost:8002/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  candidate-matcher-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/candidate-matcher-service/Dockerfile
    expose:
      - "8003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_hiring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8003/api/matches/actuator/health || wget -q -O /dev/null http://localhost:8003/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  interview-prep-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/interview-prep-service/Dockerfile
    expose:
      - "8004"
    environment:
      SERVICES_AI_INTEGRATION_BASE_URL: http://ai-integration-service:8008/api/ai
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_hiring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      SPRING_MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD is required (see .env.example)}@mongodb:27017/smart_hiring_db?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8004/api/interviews/actuator/health || wget -q -O /dev/null http://localhost:8004/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  screening-bot-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/screening-bot-service/Dockerfile
    expose:
      - "8006"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD is required (see .env.example)}@mongodb:27017/smart_hiring_db?authSource=admin
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD is required (see .env.example)}@mongodb:27017/smart_hiring_db?authSource=admin
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8006/api/screening/actuator/health || wget -q -O /dev/null http://localhost:8006/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  notification-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    expose:
      - "8007"
    environment:
      SPRING_PROFILES_ACTIVE: ${NOTIFICATION_SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smart_hiring_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8007/api/notifications/actuator/health || wget -q -O /dev/null http://localhost:8007/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles:
      - mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - smart-hiring-network

  # ── Angular HR Admin Dashboard ────────────────────────────────────────────
  hr-admin-dashboard:
    build:
      context: ./frontend/hr-admin-dashboard
      dockerfile: Dockerfile
    container_name: smart-hiring-hr-dashboard
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smart-hiring-network

  # ── React Candidate Portal ─────────────────────────────────────────────────
  candidate-portal:
    build:
      context: ./frontend/candidate-portal
      dockerfile: Dockerfile
    container_name: smart-hiring-candidate-portal
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smart-hiring-network

  job-analyzer-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/job-analyzer-service/Dockerfile
    expose:
      - "8005"
    environment:
      SERVICES_AI_INTEGRATION_BASE_URL: http://ai-integration-service:8008/api/ai
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required (see .env.example)}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD is required (see .env.example)}@mongodb:27017/smart_hiring_db?authSource=admin
      SPRING_MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD is required (see .env.example)}@mongodb:27017/smart_hiring_db?authSource=admin
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JOB_SYNC_ENABLED: "true"
      JOB_SYNC_INDIA_ENABLED: "true"
      # India only for now: candidates see and are matched against India jobs, and the US import is paused.
      JOB_MARKET: ${JOB_MARKET:-IN}
      JOB_SYNC_GLOBAL_ENABLED: ${JOB_SYNC_GLOBAL_ENABLED:-false}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    # Job feeds (tabs, keywords, filters): edit this file and restart the service; no rebuild needed.
    volumes:
      - ./services/job-analyzer-service/src/main/resources/job-feeds.yml:/config/job-feeds.yml:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8005/api/jobs/actuator/health || wget -q -O /dev/null http://localhost:8005/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

  # Internal LLM gateway for interview-prep and job-analyzer. No published port; not routed by the
  # API gateway. AI_PROVIDER picks openai (default) or anthropic.
  ai-integration-service:
    <<: *app-hardening
    build:
      context: .
      dockerfile: services/ai-integration-service/Dockerfile
    expose:
      - "8008"
    environment:
      SPRING_MONGODB_URI: mongodb://${MONGO_USERNAME:?MONGO_USERNAME is required (see .env.example)}:${MONGO_PASSWORD:?MONGO_PASSWORD is required (see .env.example)}@mongodb:27017/smart_hiring_db?authSource=admin
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    # AI instructions (e.g. resume analysis): edit this file and restart the service; no rebuild needed.
    volumes:
      - ./services/ai-integration-service/src/main/resources/ai-prompts.yml:/config/ai-prompts.yml:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8008/api/ai/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - smart-hiring-network

networks:
  smart-hiring-network:
    driver: bridge

