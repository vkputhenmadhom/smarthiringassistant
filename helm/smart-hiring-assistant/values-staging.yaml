# Staging environment overrides
global:
  environment: staging
  domain: staging-hr.smarthiringassistant.com
image:
  tag: staging-latest
services:
  apiGateway:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  authService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  resumeParserService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  candidateMatcherService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  interviewPrepService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  jobAnalyzerService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  screeningBotService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
  notificationService:
    replicas: 1
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 2
ingress:
  enabled: true
  hosts:
    - host: staging-hr.smarthiringassistant.com
      paths:
        - path: /
          pathType: Prefix
    - host: staging-candidate.smarthiringassistant.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-tls
      hosts:
        - staging-hr.smarthiringassistant.com
        - staging-candidate.smarthiringassistant.com
podDisruptionBudget:
  enabled: false
networkPolicies:
  enabled: false
