# Default values for smart-hiring-assistant Helm chart
global:
  namespace: smart-hiring
  environment: staging
  # "docker" profile resolves peers (auth-service, redis, ...) by DNS name, matching these Services
  springProfile: docker
  imagePullPolicy: IfNotPresent
  domain: staging-hr.smarthiringassistant.com
image:
  registry: ghcr.io
  organization: your-org
  tag: latest
  pullSecrets: []
database:
  host: postgres
  port: 5432
  name: smart_hiring_db
  username: hiring_user
  schema: hiring
redis:
  host: redis
  port: 6379
rabbitmq:
  host: rabbitmq
  port: 5672
  username: hiring_user
mail:
  host: smtp.gmail.com
  port: 587
monitoring:
  enabled: true
  prometheus:
    scrapeInterval: 30s
    metricsPath: /actuator/prometheus
services:
  apiGateway:
    enabled: true
    replicas: 1
    image: api-gateway
    port: 8000
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: false
    probes:
      readiness:
        path: /actuator/health/readiness
        initialDelaySeconds: 20
        periodSeconds: 10
      liveness:
        path: /actuator/health/liveness
        initialDelaySeconds: 60
        periodSeconds: 20
  authService:
    enabled: true
    replicas: 1
    image: auth-service
    port: 8001
    managementPort: 9001   # actuator runs on a separate port without the /api/auth context path
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: true
    probes:
      readiness:
        path: /actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
  resumeParserService:
    enabled: true
    replicas: 1
    image: resume-parser-service
    port: 8002
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: "1.5"
        memory: 1536Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: true
    probes:
      readiness:
        path: /api/resume-parser/actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /api/resume-parser/actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
  candidateMatcherService:
    enabled: true
    replicas: 1
    image: candidate-matcher-service
    port: 8003
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: true
    probes:
      readiness:
        path: /api/candidates/actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /api/candidates/actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
  interviewPrepService:
    enabled: true
    replicas: 1
    image: interview-prep-service
    port: 8004
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: false
    probes:
      readiness:
        path: /api/interview/actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /api/interview/actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
  jobAnalyzerService:
    enabled: true
    replicas: 1
    image: job-analyzer-service
    port: 8005
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: false
    probes:
      readiness:
        path: /api/jobs/actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /api/jobs/actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
  screeningBotService:
    enabled: true
    replicas: 1
    image: screening-bot-service
    port: 8006
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: false
    probes:
      readiness:
        path: /api/screening/actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /api/screening/actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
  notificationService:
    enabled: true
    replicas: 2
    image: notification-service
    port: 8007
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 70
      targetMemory: 80
    initContainer:
      enabled: false
    probes:
      readiness:
        path: /api/notifications/actuator/health/readiness
        initialDelaySeconds: 30
        periodSeconds: 10
      liveness:
        path: /api/notifications/actuator/health/liveness
        initialDelaySeconds: 75
        periodSeconds: 20
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
networkPolicies:
  enabled: false
  ingressEnabled: false
podDisruptionBudget:
  enabled: false
  minAvailable: 1
serviceAccount:
  create: true
  name: smart-hiring
rbac:
  create: true
securityContext:
  runAsNonRoot: false
  fsGroup: 1000
affinity: {}
tolerations: []
nodeSelector: {}
